name: Deploy Giovi Yoga su GitHub Pages

on:
  push:
    branches: [claude/yoga-app-analysis-planning-sc1kko]
    paths:
      - 'yoga-app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Il sorgente è pensato per essere incapsulato da un wrapper HTML:
      # qui aggiungiamo doctype e charset per servirlo in standards mode.
      - name: Prepara il sito
        run: |
          mkdir -p _site
          { printf '<!doctype html>\n<meta charset="utf-8">\n'; cat yoga-app/index.html; } > _site/index.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
