name: Deploy Giovi Yoga su GitHub Pages

on:
  push:
    branches: [claude/yoga-app-analysis-planning-sc1kko]
    paths:
      - 'yoga-app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Il sorgente è pensato per essere incapsulato da un wrapper HTML:
      # qui aggiungiamo doctype e charset per servirlo in standards mode.
      - name: Prepara il sito
        run: |
          mkdir -p _site
          { printf '<!doctype html>\n<meta charset="utf-8">\n'; cat yoga-app/index.html; } > _site/index.html
          touch _site/.nojekyll

      # Il token di Actions non può attivare Pages via API su questo repo,
      # quindi pubblichiamo sul branch gh-pages che GitHub serve da solo.
      - name: Pubblica su gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy da ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
